name: Sync YFinance Snapshots

# Manual-only health check. It no longer runs on a schedule and no longer
# commits or pushes snapshots: Yahoo-derived data is not republished from this
# public repo (decision D51, docs/alignment/decision-register.md).
on:
  workflow_dispatch:

concurrency:
  group: sync-yfinance-snapshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install sync dependencies
        run: pip install -r requirements-sync.txt

      - name: Refresh snapshots
        run: ./scripts/refresh_yfinance.sh --period 5y

      - name: Run frontend regressions against refreshed snapshots
        run: node scripts/run_frontend_regression_checks.mjs
